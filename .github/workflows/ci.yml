name: Praxim Continuous Integration Gate

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Zero-Egress & Build Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-provider: basic

      - name: Verify Topology & Run Zero-Egress Audit
        run: |
          ./gradlew projects --stacktrace
          ./gradlew checkZeroEgressPolicy --stacktrace

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --stacktrace
